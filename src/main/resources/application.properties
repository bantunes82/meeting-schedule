spring.application.name=meeting-schedule

# Avoids Spring removing "X-Forwarded-For" headers
server.forward-headers-strategy=none

# JPA / Hibernate
#With this setup, Spring Boot application will first apply missing Flyway scripts to the database and then check if the
#JPA and database model match during startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# open-in-view holds the connection open during the whole http request execution
# even after the transaction is commited and finished, for no good reason
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true

# Database a HikariCP Connection Pool
database.dbname=${DS_DB_NAME:meeting_schedule}
database.hostname=${DS_HOST:127.0.0.1}
database.port=${DS_PORT:5432}
spring.datasource.url=jdbc:postgresql://${database.hostname}:${database.port}/${database.dbname}
spring.datasource.username=${DS_LOGIN:myuser}
spring.datasource.password=${DS_PASSWORD:secret}
spring.datasource.hikari.maximum-pool-size=${MAX_DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${MIN_DB_POOL_SIZE:4}
# auto-commit forces spring to acquire a connection at the start of a transactional method
# and commit the transaction at each query
# this lost control waste resources and hold connection for longer then necessary
spring.datasource.hikari.auto-commit=false

## Logging configuration
logging.level.root=INFO
logging.group.application=com.bantunes82.meeting.schedule
logging.level.application=INFO

## API Versioning configuration
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.supported=1.0,2.0
spring.mvc.apiversion.default=1.0

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# OpenTelemetry
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.observations.annotations.enabled=true
# 100% of traces will be sampled, adjust as needed for production environments (only for testing and development environments)
management.tracing.sampling.probability=1.0

## Docker-Compose configuration
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop
spring.docker.compose.stop.timeout=1m
spring.docker.compose.skip.in-tests=false

## Application information
info.app.encoding=@project.build.sourceEncoding@
info.app.java.source=@language.compiler.level@
info.app.java.target=@language.compiler.level@

# Virtual Threads
spring.threads.virtual.enabled=true
