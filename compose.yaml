services:
  postgres:
    image: 'postgres:18.1'
    environment:
      - 'POSTGRES_DB=meeting_schedule'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000' # UI
      - '4317:4317'
      - '4318:4318'

